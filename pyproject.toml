[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apiforge"
version = "0.1.0"
description = "APIForge AI: Multi-Agent Framework for Intelligent API Design, Automated Review, Documentation, and Testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "openapi-spec-validator>=0.7.1",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=0.1.1",
    "openai>=1.20.0",
]

[project.scripts]
apiforge = "apiforge.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["apiforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

