openapi: 3.1.0
info:
  title: Task & Project Management API
  version: 1.0.0
  description: API for managing projects, tasks, team assignments, and statuses.
servers:
- url: http://localhost:8000
  description: Local Development Server
paths:
  /projects:
    post:
      operationId: post_projects
      summary: Create a new project
      description: Creates a project workspace
      tags:
      - Projects
      parameters: []
      responses:
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Payload data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
    get:
      operationId: get_projects
      summary: List all projects
      description: Retrieves paginated list of projects
      tags:
      - Projects
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        description: Number of records to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /projects/{project_id}:
    get:
      operationId: get_projects_project_id
      summary: Get project by ID
      description: Fetches a project by its unique ID
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for project_id
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    delete:
      operationId: delete_projects_project_id
      summary: Delete project
      description: Deletes project by ID
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for project_id
        schema:
          type: string
      responses:
        '204':
          description: Resource deleted successfully
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /tasks:
    post:
      operationId: post_tasks
      summary: Create task
      description: Creates a new task
      tags:
      - Tasks
      parameters: []
      responses:
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Payload data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
    get:
      operationId: get_tasks
      summary: List tasks
      description: Retrieves tasks
      tags:
      - Tasks
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        description: Number of records to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /tasks/{task_id}:
    get:
      operationId: get_tasks_task_id
      summary: Get task
      description: Fetches task by ID
      tags:
      - Tasks
      parameters:
      - name: task_id
        in: path
        required: true
        description: Unique identifier for task_id
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    delete:
      operationId: delete_tasks_task_id
      summary: Delete task
      description: Deletes task by ID
      tags:
      - Tasks
      parameters:
      - name: task_id
        in: path
        required: true
        description: Unique identifier for task_id
        schema:
          type: string
      responses:
        '204':
          description: Resource deleted successfully
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    put:
      operationId: put_tasks_task_id
      summary: Update task
      description: Updates task status
      tags:
      - Tasks
      parameters:
      - name: task_id
        in: path
        required: true
        description: Unique identifier for task_id
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized / Missing Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Payload data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - detail
      - status
      properties:
        detail:
          type: string
          description: Human-readable error description
          example: sample_detail
        status:
          type: integer
          description: HTTP status code
          example: 101
        code:
          type: string
          description: Error classification code
          example: sample_code
      example:
        detail: sample_detail
        status: 101
        code: sample_code
    Project:
      type: object
      description: A workspace containing tasks
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: Sample id
        name: &id001
          type: string
          example: Sample name
        description: &id002
          type: string
          example: Sample description
        created_at:
          type: string
          example: Sample created_at
      example:
        id: Sample id
        name: Sample name
        description: Sample description
        created_at: Sample created_at
    ProjectCreate:
      type: object
      description: Payload for creating a new Project
      required:
      - name
      properties:
        name: *id001
        description: *id002
      example:
        name: Sample name
        description: Sample description
    ProjectListResponse:
      type: object
      description: Paginated list of Project records
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
          example: []
        total:
          type: integer
          example: 100
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
      example:
        items: []
        total: 100
        limit: 20
        offset: 0
    Task:
      type: object
      description: An actionable work item within a project
      required:
      - id
      - title
      properties:
        id:
          type: string
          example: Sample id
        project_id: &id003
          type: string
          example: Sample project_id
        title: &id004
          type: string
          example: Sample title
        status: &id005
          type: string
          example: Sample status
        assigned_to: &id006
          type: string
          example: Sample assigned_to
      example:
        id: Sample id
        project_id: Sample project_id
        title: Sample title
        status: Sample status
        assigned_to: Sample assigned_to
    TaskCreate:
      type: object
      description: Payload for creating a new Task
      required:
      - title
      properties:
        project_id: *id003
        title: *id004
        status: *id005
        assigned_to: *id006
      example:
        project_id: Sample project_id
        title: Sample title
        status: Sample status
        assigned_to: Sample assigned_to
    TaskListResponse:
      type: object
      description: Paginated list of Task records
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          example: []
        total:
          type: integer
          example: 100
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
      example:
        items: []
        total: 100
        limit: 20
        offset: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token
